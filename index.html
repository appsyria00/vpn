<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز إدارة التل</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: linear-gradient(135deg, #0f2027, #2c5364); color: white; min-height: 100vh; display: flex; align-items: center; }
        .booking-box { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border-radius: 25px; padding: 30px; width: 90%; max-width: 450px; margin: auto; border: 1px solid rgba(255,255,255,0.2); }
        .form-control, .form-select { border-radius: 12px; margin-bottom: 15px; border: none; padding: 12px; }
        .btn-confirm { background: #0088cc; color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <div class="booking-box text-center shadow-lg">
        <h2 class="mb-2">حجز موعد جديد</h2>
        <p class="text-white-50 mb-4 small">إدارة منطقة التل المدنية</p>
        <form id="f">
            <input type="text" id="n" class="form-control" placeholder="الاسم الكامل" required>
            <input type="tel" id="p" class="form-control" placeholder="رقم الهاتف" required>
            <div class="row g-2">
                <div class="col-7"><input type="date" id="d" class="form-control" required></div>
                <div class="col-5"><input type="time" id="t" class="form-control" required></div>
            </div>
            <select id="s" class="form-select">
                <option value="مستعجل">مستعجل</option>
                <option value="سؤال عام">سؤال عام</option>
                <option value="استشارة">استشارة</option>
            </select>
            <button type="submit" class="btn-confirm">تأكيد الحجز</button>
        </form>
        <button onclick="goAdmin()" class="btn btn-link text-white-50 mt-3 small" style="text-decoration:none">دخول الإدارة</button>
    </div>

    <script>
        const api = 'https://script.google.com/macros/s/AKfycbwzQnSarAP-F8ZouRE-LTxoJut9EvuY6RtSXkLGH3lyDhgmHZnMJt4fwXQJdqmtrN8t7g/exec';

        document.getElementById('f').onsubmit = async e => {
            e.preventDefault();
            Swal.fire({title:'جاري الحفظ...', allowOutsideClick: false, didOpen:()=>Swal.showLoading()});
            
            try {
                await fetch(api, {method:'POST', body: JSON.stringify({
                    name: document.getElementById('n').value,
                    phone: document.getElementById('p').value,
                    date: document.getElementById('d').value,
                    time: document.getElementById('t').value,
                    service: document.getElementById('s').value
                })});
                Swal.close();
                Swal.fire('تم بنجاح!', 'تم تسجيل موعدك وتنبيه الإدارة', 'success');
                document.getElementById('f').reset();
            } catch(e) {
                Swal.close();
                Swal.fire('خطأ', 'فشل الإرسال', 'error');
            }
        };

        async function goAdmin() {
            const { value: pass } = await Swal.fire({title:'كلمة المرور', input:'password', showCancelButton:true});
            if(pass === "20262026") window.location.href = 'admin.html';
            else if(pass) Swal.fire('خطأ', 'كلمة المرور غير صحيحة', 'error');
        }
    </script>
</body>
</html>
