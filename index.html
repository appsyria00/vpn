<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز مواعيد إدارة منطقة التل المدنية</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0088cc">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            margin: 0;
        }
        .booking-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 450px;
            width: 90%;
            margin: 20px auto;
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            border: none;
            padding: 12px;
            margin-bottom: 15px;
            color: #333;
        }
        .btn-submit {
            background: #0088cc;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            color: white;
            width: 100%;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background: #0077b5;
            transform: translateY(-2px);
        }
        .admin-link-btn {
            background: transparent;
            color: rgba(255,255,255,0.4);
            border: none;
            margin-top: 20px;
            font-size: 0.75rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="booking-container animate__animated animate__fadeIn">
        <div class="text-center">
            <h2 class="mb-3">حجز موعد جديد</h2>
            <p class="text-light-50 mb-4 small">سجل بياناتك وسيصل إشعار للمدير فوراً</p>
        </div>

        <form id="bookingForm">
            <input type="text" id="name" class="form-control" placeholder="الاسم الكامل" required>
            <input type="tel" id="phone" class="form-control" placeholder="رقم الهاتف" required>
            <input type="date" id="date" class="form-control" required>
            <select id="service" class="form-select">
                <option value="مستعجل">مستعجل</option>
                <option value="سؤال عام">سؤال عام</option>
                <option value="استشارة">استشارة</option>
            </select>
            <button type="submit" class="btn-submit shadow">تأكيد الحجز وإرسال</button>
        </form>

        <div class="text-center">
            <button onclick="goToAdmin()" class="admin-link-btn">
                <i class="fas fa-lock"></i> لوحة الإدارة
            </button>
        </div>
    </div>
</div>

<script>
    // الرابط البرمجي الخاص بك
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzil4Ff6XjW0IIX2jiI3iZXRVEgw0dDTZBFkpojSGmOAU2XpVzcUJGRMH92kyquJ0r1WA/exec';

    // 1. إرسال البيانات
    document.getElementById('bookingForm').addEventListener('submit', e => {
        e.preventDefault();
        Swal.fire({ title: 'جاري الإرسال...', didOpen: () => { Swal.showLoading() } });

        const formData = {
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            date: document.getElementById('date').value,
            service: document.getElementById('service').value
        };

        fetch(scriptURL, { method: 'POST', body: JSON.stringify(formData) })
        .then(() => {
            Swal.fire('تم بنجاح!', 'تم حفظ الموعد ', 'success');
            document.getElementById('bookingForm').reset();
        })
        .catch(() => Swal.fire('خطأ', 'فشل في الاتصال بالخادم', 'error'));
    });

    // 2. التحقق من كلمة المرور (20262026)
    async function goToAdmin() {
        const { value: password } = await Swal.fire({
            title: 'دخول الإدارة',
            input: 'password',
            inputPlaceholder: 'أدخل كلمة المرور',
            showCancelButton: true,
            confirmButtonText: 'دخول',
            cancelButtonText: 'إلغاء'
        });

        // كلمة المرور الصافية
        const correctPassword = "20262026";

        if (password) {
            if (password === correctPassword) {
                window.location.href = 'admin.html';
            } else {
                Swal.fire('خطأ!', 'كلمة المرور غير صحيحة', 'error');
            }
        }
    }

    // تسجيل ميزة PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
</script>
</body>
</html>
