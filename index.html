<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - إدارة منطقة مدينة التل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; font-family: sans-serif; color: white; }
        .booking-card { background: #1e293b; border-radius: 30px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 100%; max-width: 450px; margin: auto; border: 1px solid #334155; }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #fdbb2d; margin: 0 auto 20px; display: block; box-shadow: 0 0 20px rgba(253, 187, 45, 0.3); }
        .form-control, .form-select { background: #334155; border: 1px solid #475569; color: white; border-radius: 12px; padding: 12px; }
        .form-control::placeholder { color: #94a3b8; }
        .form-control:focus { background: #475569; color: white; border-color: #3b82f6; box-shadow: none; }
        .btn-submit { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: white; border-radius: 15px; padding: 15px; font-weight: bold; width: 100%; border: none; margin-top: 10px; transition: 0.3s; }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4); }
        .footer-am { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #94a3b8; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="booking-card">
            <img src="https://appsyria00.github.io/vpn/1.png" id="userLogo" class="profile-img" alt="Logo">
            <h3 class="text-center fw-bold mb-2">إدارة منطقة مدينة التل</h3>
            <p class="text-center text-info small mb-4">نظام إدارة المواعيد الذكي</p>
            <form id="bookingForm">
                <div class="mb-3"><input type="text" name="name" class="form-control" placeholder="الاسم الكامل" required></div>
                <div class="mb-3"><input type="tel" name="phone" class="form-control" placeholder="رقم الهاتف" required></div>
                <div class="row g-2 mb-3">
                    <div class="col-6"><input type="date" name="date" class="form-control" required></div>
                    <div class="col-6"><input type="time" name="time" class="form-control" required></div>
                </div>
                <div class="mb-4">
                    <select name="service" class="form-select" required>
                        <option value="">اختر نوع الطلب...</option>
                        <option value="طلب استشارة">طلب استشارة</option>
                        <option value="حجز موعد مراجعة">حجز موعد مراجعة</option>
                        <option value="متابعة ملف">متابعة ملف</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">تأكيد الحجز الآن</button>
            </form>
            <div class="footer-am">تصميم A.M</div>
        </div>
    </div>
    <script>
        const API = 'https://script.google.com/macros/s/AKfycbycQ1WfZL86r3WZArEiVyeUgCEAPnDJvMLsp0_Y_GPuQVyqwxSmdW2fXKGB2LvxHtcjXg/exec';
        document.getElementById('bookingForm').onsubmit = async (e) => {
            e.preventDefault();
            Swal.fire({ title: 'جاري الحجز...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const formData = new FormData(e.target);
            try {
                const res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.fromEntries(formData)) });
                const result = await res.json();
                if(result.status === 'exists') return Swal.fire('عذراً', 'هذا الموعد محجوز مسبقاً', 'warning');
                Swal.fire('تم بنجاح', 'تم تسجيل طلبك بنجاح', 'success');
                e.target.reset();
            } catch (err) { Swal.fire('خطأ', 'فشل الاتصال بالسيرفر', 'error'); }
        };
    </script>
</body>
</html>
