<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام حجز المواعيد الذكي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .booking-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 500px;
            width: 100%;
            margin: auto;
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            border: none;
            padding: 12px;
            margin-bottom: 20px;
        }
        .btn-submit {
            background: #0088cc; /* لون تلغرام */
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
            color: white;
            width: 100%;
        }
        .btn-submit:hover {
            background: #0077b5;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,136,204,0.4);
        }
        .logo {
            width: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px #0088cc);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="booking-container animate__animated animate__fadeIn">
        <div class="text-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Logo" class="logo">
            <h2 class="mb-4">حجز موعد جديد</h2>
            <p class="text-light-50 mb-4">سجل بياناتك وسيتم إرسال تنبيه للمدير فوراً</p>
        </div>

        <form id="bookingForm">
            <div class="form-group">
                <label class="mb-2">الاسم الكامل</label>
                <input type="text" id="name" class="form-control" placeholder="أدخل اسمك هنا" required>
            </div>
            
            <div class="form-group">
                <label class="mb-2">رقم الهاتف</label>
                <input type="tel" id="phone" class="form-control" placeholder="09xxxxxxxx" required>
            </div>

            <div class="form-group">
                <label class="mb-2">تاريخ الموعد</label>
                <input type="date" id="date" class="form-control" required>
            </div>

            <div class="form-group">
                <label class="mb-2">الخدمة المطلوبة</label>
                <select id="service" class="form-select">
                    <option value="اشتراك VPN">اشتراك VPN</option>
                    <option value="دعم فني">دعم فني</option>
                    <option value="استشارة تقنية">استشارة تقنية</option>
                </select>
            </div>

            <button type="submit" class="btn-submit mt-3">تأكيد الحجز وإرسال</button>
        </form>
    </div>
</div>

<script>
    // الرابط الخاص بك الذي زودتني به
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxj_lurn1D343tqAHJBJyeKL2DG8K6IvRQE15CMtyOTk9sHV2wVXZhkR0vj7vlQ1JnavA/exec';

    const form = document.getElementById('bookingForm');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        // إظهار رسالة جاري التحميل
        Swal.fire({
            title: 'جاري إرسال طلبك...',
            text: 'يتم الآن الحفظ في الجدول وإرسال إشعار تلغرام',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading() }
        });

        const formData = {
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            date: document.getElementById('date').value,
            service: document.getElementById('service').value
        };

        // إرسال البيانات إلى قوقل سكريبت
        fetch(scriptURL, { 
            method: 'POST', 
            body: JSON.stringify(formData) 
        })
        .then(response => {
            Swal.fire({
                icon: 'success',
                title: 'تم الحجز بنجاح!',
                text: 'وصل التنبيه للمدير عبر تلغرام وتم تسجيل بياناتك.',
                confirmButtonColor: '#0088cc'
            });
            form.reset(); // تفريغ الحقول بعد النجاح
        })
        .catch(error => {
            Swal.fire({
                icon: 'error',
                title: 'عذراً!',
                text: 'حدث خطأ في الاتصال، تأكد من إعدادات الـ Deploy في قوقل.',
            });
            console.error('Error!', error.message);
        });
    });
</script>

</body>
</html>
