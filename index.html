<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - إدارة التل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: linear-gradient(135deg, #0f2027, #2c5364); color: #fff; min-height: 100vh; display: flex; align-items: center; }
        .booking-container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; width: 90%; max-width: 450px; margin: auto; border: 1px solid rgba(255,255,255,0.1); }
        .form-control, .form-select { border-radius: 10px; margin-bottom: 15px; }
        .btn-submit { background: #0088cc; color: white; border-radius: 10px; padding: 12px; width: 100%; font-weight: bold; border: none; }
    </style>
</head>
<body>
<div class="booking-container text-center">
    <h3>حجز موعد جديد</h3>
    <p class="small mb-4">إدارة منطقة التل المدنية</p>
    <form id="bookingForm">
        <input type="text" id="name" class="form-control" placeholder="الاسم الكامل" required>
        <input type="tel" id="phone" class="form-control" placeholder="رقم الهاتف" required>
        <div class="row g-2">
            <div class="col-7"><input type="date" id="date" class="form-control" required title="اختر التاريخ"></div>
            <div class="col-5"><input type="time" id="time" class="form-control" required title="اختر الوقت"></div>
        </div>
        <select id="service" class="form-select">
            <option value="مستعجل">مستعجل</option>
            <option value="سؤال عام">سؤال عام</option>
            <option value="استشارة">استشارة</option>
        </select>
        <button type="submit" class="btn-submit shadow">تأكيد الحجز</button>
    </form>
    <button onclick="goToAdmin()" class="btn btn-link text-white-50 mt-3 small" style="text-decoration:none">لوحة الإدارة</button>
</div>

<script>
    const scriptURL = 'ضع_هنا_رابط_الـ_DEPLOY_الجديد';

    document.getElementById('bookingForm').addEventListener('submit', e => {
        e.preventDefault();
        Swal.fire({ title: 'جاري الإرسال...', didOpen: () => Swal.showLoading() });

        const formData = {
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            date: document.getElementById('date').value,
            time: document.getElementById('time').value,
            service: document.getElementById('service').value
        };

        fetch(scriptURL, { method: 'POST', body: JSON.stringify(formData) })
        .then(() => {
            Swal.fire('تم بنجاح!', 'تم حفظ موعدك وإرسال تنبيه للإدارة', 'success');
            document.getElementById('bookingForm').reset();
        })
        .catch(() => Swal.fire('خطأ', 'فشل الإرسال، جرب مرة أخرى', 'error'));
    });

    async function goToAdmin() {
        const { value: pass } = await Swal.fire({ title:'دخول الإدارة', input:'password', showCancelButton:true });
        if (pass === "20262026") window.location.href = 'admin.html';
        else if(pass) Swal.fire('خطأ', 'كلمة المرور غير صحيحة', 'error');
    }
</script>
</body>
</html>
