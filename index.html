<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز مواعيد إدارة منطقة التل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: linear-gradient(135deg, #0f2027, #2c5364); color: white; min-height: 100vh; display: flex; align-items: center; font-family: sans-serif; }
        .box { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border-radius: 25px; padding: 25px; width: 95%; max-width: 420px; margin: auto; border: 1px solid rgba(255,255,255,0.2); text-center; }
        .logo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #fdbb2d; margin-bottom: 15px; }
        .form-control, .form-select { border-radius: 12px; margin-bottom: 15px; border: none; padding: 12px; }
        .footer-text { font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box text-center shadow-lg">
        <img src="https://appsyria00.github.io/vpn/1.png" class="logo" alt="Logo"> <h4 class="mb-4">إدارة منطقة التل المدنية</h4>
        <form id="f">
            <input type="text" id="n" class="form-control" placeholder="الاسم الكامل" required>
            <input type="tel" id="p" class="form-control" placeholder="رقم الهاتف" required>
            <div class="row g-2">
                <div class="col-7"><input type="date" id="d" class="form-control" required></div>
                <div class="col-5"><input type="time" id="t" class="form-control" required></div>
            </div>
            <select id="s" class="form-select">
                <option value="مستعجل">مستعجل</option>
                <option value="سؤال عام">سؤال عام</option>
                <option value="استشارة">استشارة</option>
            </select>
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow">تأكيد الحجز</button>
        </form>
        <button onclick="goAdmin()" class="btn btn-link text-white-50 mt-2 small" style="text-decoration:none">لوحة الإدارة</button>
        <div class="footer-text">تصميم A.M</div>
    </div>

    <script>
        const api = 'https://script.google.com/macros/s/AKfycbxLk5XTHesxo-YMITsr-HU7TD5PQ9LQuWs4q_TXEK5C3blEy-Nz7Z67aGnXLrH-hMjyZQ/exec';
        document.getElementById('f').onsubmit = async e => {
            e.preventDefault();
            Swal.fire({title:'جاري الحفظ...', allowOutsideClick: false, didOpen:()=>Swal.showLoading()});
            try {
                const response = await fetch(api, {method:'POST', body: JSON.stringify({
                    name: document.getElementById('n').value, phone: document.getElementById('p').value,
                    date: document.getElementById('d').value, time: document.getElementById('t').value, service: document.getElementById('s').value
                })});
                const resData = await response.json();
                Swal.close();
                if(resData.status === "exists") Swal.fire('تنبيه', resData.message, 'warning');
                else { Swal.fire('تم بنجاح!', 'تم تسجيل موعدك', 'success'); document.getElementById('f').reset(); }
            } catch(e) { Swal.close(); Swal.fire('خطأ', 'فشل الاتصال', 'error'); }
        };
        async function goAdmin() {
            const { value: pass } = await Swal.fire({title:'كلمة المرور', input:'password', showCancelButton:true});
            if(pass === "0968899922") window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
