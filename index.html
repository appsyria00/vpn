<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - إدارة منطقة مدينة التل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; font-family: sans-serif; color: white; margin: 0; }
        .booking-card { background: #1e293b; border-radius: 30px; padding: 35px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 100%; max-width: 420px; margin: auto; border: 1px solid #334155; position: relative; }
        
        /* جعل الصورة الشخصية رابطاً لصفحة المدير عند الضغط المطول أو الضغط العادي */
        .profile-img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid #fdbb2d; margin: 0 auto 20px; display: block; cursor: pointer; transition: 0.3s; }
        .profile-img:hover { transform: scale(1.05); filter: brightness(1.2); }

        .form-control, .form-select { background: #334155; border: 1px solid #475569; color: white; border-radius: 12px; padding: 12px; }
        .form-control:focus { background: #475569; color: white; border-color: #3b82f6; box-shadow: none; }
        
        .btn-submit { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: white; border-radius: 15px; padding: 14px; font-weight: bold; width: 100%; border: none; margin-top: 10px; transition: 0.3s; }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4); }
        
        /* زر المدير المخفي في أسفل الصفحة */
        .admin-link { position: absolute; bottom: 15px; left: 15px; color: #334155; text-decoration: none; font-size: 0.8rem; transition: 0.3s; }
        .admin-link:hover { color: #3b82f6; }
        
        .footer-am { text-align: center; margin-top: 20px; font-size: 0.8rem; color: #94a3b8; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="booking-card">
            <a href="admin.html" title="دخول المدير">
                <img src="رابط_صورتك_هنا" class="profile-img" alt="Logo">
            </a>

            <h3 class="text-center fw-bold mb-1">إدارة منطقة مدينة التل</h3>
            <p class="text-center text-info small mb-4">قسم حجز المواعيد والاستشارات</p>

            <form id="bookingForm">
                <div class="mb-3"><input type="text" name="name" class="form-control" placeholder="الاسم الكامل" required></div>
                <div class="mb-3"><input type="tel" name="phone" class="form-control" placeholder="رقم الهاتف" required></div>
                <div class="row g-2 mb-3">
                    <div class="col-6"><input type="date" name="date" class="form-control" required></div>
                    <div class="col-6"><input type="time" name="time" class="form-control" required></div>
                </div>
                <div class="mb-4">
                    <select name="service" class="form-select" required>
                        <option value="">نوع الطلب...</option>
                        <option value="طلب استشارة">طلب استشارة</option>
                        <option value="حجز موعد مراجعة">حجز موعد مراجعة</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">تأكيد الحجز</button>
            </form>

            <div class="footer-am">DESIGN BY A.M</div>
            
            <a href="admin.html" class="admin-link"><i class="fas fa-lock"></i></a>
        </div>
    </div>

    <script>
        const API = 'https://script.google.com/macros/s/AKfycbzfQMZfsjuGjRpP0ub0VM4ZQd1K4AetReU5TKvMFAoZmp280EIrk6RGTCFlKMGGQdf_ng/exec';
        
        document.getElementById('bookingForm').onsubmit = async (e) => {
            e.preventDefault();
            Swal.fire({ title: 'جاري تسجيل الطلب...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            const formData = new FormData(e.target);
            try {
                const res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.fromEntries(formData)) });
                const result = await res.json();
                
                if(result.status === 'exists') {
                    return Swal.fire('عذراً', 'هذا الوقت محجوز مسبقاً، اختر وقتاً آخر', 'warning');
                }
                
                Swal.fire({ icon: 'success', title: 'تم الحجز بنجاح', text: 'سنتواصل معك قريباً لتأكيد الموعد', confirmButtonColor: '#3b82f6' });
                e.target.reset();
            } catch (err) {
                Swal.fire('خطأ', 'فشل الاتصال بالسيرفر، تأكد من الإنترنت', 'error');
            }
        };
    </script>
</body>
</html>
