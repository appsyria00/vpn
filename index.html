<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - إدارة التل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); min-height: 100vh; display: flex; align-items: center; font-family: sans-serif; }
        .booking-card { background: white; border-radius: 25px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 450px; margin: auto; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid #fdbb2d; margin: 0 auto 15px; display: block; }
        .btn-submit { background: #1e3a8a; color: white; border-radius: 12px; padding: 12px; font-weight: bold; width: 100%; border: none; transition: 0.3s; }
        .btn-submit:hover { background: #162a63; transform: scale(1.02); }
        .footer-am { text-align: center; margin-top: 15px; font-size: 0.8rem; color: #666; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="booking-card">
            <img src="رابط_صورتك_هنا" class="profile-img" alt="Logo">
            <h4 class="text-center fw-bold mb-4">إدارة منطقة التل المدنية</h4>
            <form id="bookingForm">
                <div class="mb-3"><input type="text" name="name" class="form-control" placeholder="الاسم الكامل" required></div>
                <div class="mb-3"><input type="tel" name="phone" class="form-control" placeholder="رقم الهاتف" required></div>
                <div class="row g-2 mb-3">
                    <div class="col-6"><input type="date" name="date" class="form-control" required></div>
                    <div class="col-6"><input type="time" name="time" class="form-control" required></div>
                </div>
                <div class="mb-4">
                    <select name="service" class="form-select" required>
                        <option value="">اختر نوع الخدمة...</option>
                        <option value="تسجيل مدني">تسجيل مدني</option>
                        <option value="بطاقة شخصية">بطاقة شخصية</option>
                        <option value="جواز سفر">جواز سفر</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">تأكيد الحجز الآن</button>
            </form>
            <div class="footer-am">تصميم A.M</div>
        </div>
    </div>

    <script>
        const API = 'https://script.google.com/macros/s/AKfycbzfQMZfsjuGjRpP0ub0VM4ZQd1K4AetReU5TKvMFAoZmp280EIrk6RGTCFlKMGGQdf_ng/exec';
        document.getElementById('bookingForm').onsubmit = async (e) => {
            e.preventDefault();
            Swal.fire({ title: 'جاري الإرسال...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            try {
                const res = await fetch(API, { method: 'POST', body: JSON.stringify(data) });
                const result = await res.json();
                if(result.status === 'exists') return Swal.fire('عذراً', 'هذا الموعد محجوز مسبقاً', 'warning');
                Swal.fire('تم بنجاح', 'تم تسجيل موعدك وتنبيه الإدارة', 'success');
                e.target.reset();
            } catch (err) { Swal.fire('خطأ', 'فشل الاتصال بالسيرفر', 'error'); }
        };
    </script>
</body>
</html>
