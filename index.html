<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - التل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: linear-gradient(135deg, #0f2027, #2c5364); color: white; min-height: 100vh; display: flex; align-items: center; }
        .box { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border-radius: 25px; padding: 30px; width: 90%; max-width: 400px; margin: auto; border: 1px solid rgba(255,255,255,0.2); }
        .form-control, .form-select { border-radius: 12px; margin-bottom: 15px; border: none; padding: 12px; }
    </style>
</head>
<body>
    <div class="box text-center shadow-lg">
        <h3 class="mb-4">حجز موعد جديد</h3>
        <form id="f">
            <input type="text" id="n" class="form-control" placeholder="الاسم الكامل" required>
            <input type="tel" id="p" class="form-control" placeholder="رقم الهاتف" required>
            <div class="row g-2">
                <div class="col-7"><input type="date" id="d" class="form-control" required></div>
                <div class="col-5"><input type="time" id="t" class="form-control" required></div>
            </div>
            <select id="s" class="form-select">
                <option value="مستعجل">مستعجل</option>
                <option value="سؤال عام">سؤال عام</option>
                <option value="استشارة">استشارة</option>
            </select>
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow">تأكيد الحجز</button>
        </form>
    </div>

    <script>
        const api = 'https://script.google.com/macros/s/AKfycbyu0l8PAVfBUAlS6bo1QfSjnm3H9qPfeWWgKXxiHBshr0vFzrrtjdc448aBAU3a7ts9fQ/exec';
        document.getElementById('f').onsubmit = async e => {
            e.preventDefault();
            Swal.fire({title:'جاري الحفظ...', allowOutsideClick: false, didOpen:()=>Swal.showLoading()});
            try {
                await fetch(api, {method:'POST', body: JSON.stringify({
                    name: document.getElementById('n').value,
                    phone: document.getElementById('p').value,
                    date: document.getElementById('d').value,
                    time: document.getElementById('t').value,
                    service: document.getElementById('s').value
                })});
                Swal.close();
                Swal.fire('تم بنجاح!', 'تم تسجيل موعدك وتنبيه البوت', 'success');
                document.getElementById('f').reset();
            } catch(e) { 
                Swal.close(); 
                Swal.fire('خطأ', 'فشل في الإرسال', 'error'); 
            }
        };
    </script>
</body>
</html>
