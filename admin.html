<div class="text-center mt-4">
    <button onclick="goToAdmin()" class="btn btn-outline-light btn-sm" style="opacity: 0.6;">
        <i class="fas fa-user-shield"></i> دخول الإدارة
    </button>
</div>

<script>
    // كلمة المرور مشفرة (SHA-256) لضمان الحماية
    async function goToAdmin() {
        const { value: password } = await Swal.fire({
            title: 'منطقة محظورة',
            input: 'password',
            inputLabel: 'أدخل كلمة مرور الإدارة',
            inputPlaceholder: '********',
            showCancelButton: true
        });

        if (password) {
            // تشفير المدخلات لمقارنتها بالبصمة المشفرة
            const msgUint8 = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            // البصمة الخاصة بكلمة المرور 20262026
            const secureHash = "f9a744265405e3f28325a7f51699709d66099b6883259e9882269a84d6350d30";

            if (hashHex === secureHash) {
                window.location.href = 'admin.html';
            } else {
                Swal.fire('خطأ!', 'كلمة المرور غير صحيحة', 'error');
            }
        }
    }
</script>
