<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة المواعيد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .admin-header { background: #2c3e50; color: white; padding: 20px; margin-bottom: 30px; border-bottom: 5px solid #0088cc; }
        .appointment-card { background: white; border-radius: 15px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; margin-bottom: 20px; }
        .appointment-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.15); }
        .status-badge { background: #e8f5e9; color: #2e7d32; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; }
        .phone-link { color: #0088cc; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="admin-header text-center">
    <h1>📋 قائمة المواعيد المسجلة</h1>
    <p>إدارة الحجوزات القادمة من الموقع</p>
</div>

<div class="container">
    <div id="loading" class="text-center">
        <div class="spinner-border text-primary" role="status"></div>
        <p>جاري تحميل المواعيد...</p>
    </div>

    <div class="row" id="appointmentsList">
        </div>
</div>

<script>
    const scriptURL = 'رابط_الـ_DEPLOY_الخاص_بك_هنا';

    async function fetchAppointments() {
        try {
            const response = await fetch(scriptURL);
            const data = await response.json();
            const list = document.getElementById('appointmentsList');
            document.getElementById('loading').style.display = 'none';

            if (data.length === 0) {
                list.innerHTML = '<div class="col-12 text-center"><h3>لا توجد مواعيد مسجلة بعد</h3></div>';
                return;
            }

            // عرض المواعيد من الأحدث إلى الأقدم
            data.reverse().forEach(item => {
                const card = `
                    <div class="col-md-4">
                        <div class="card appointment-card p-3">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="status-badge">حجز جديد</span>
                                <small class="text-muted">${new Date(item.timestamp).toLocaleDateString('ar-EG')}</small>
                            </div>
                            <h5 class="card-title">${item.name}</h5>
                            <p class="card-text text-secondary mb-1">🛠 الخدمة: <strong>${item.service}</strong></p>
                            <p class="card-text text-secondary mb-1">📅 موعد الحجز: ${item.date}</p>
                            <hr>
                            <div class="text-center">
                                <a href="tel:${item.phone}" class="phone-link">📞 اتصل الآن: ${item.phone}</a>
                            </div>
                        </div>
                    </div>
                `;
                list.innerHTML += card;
            });
        } catch (error) {
            console.error('خطأ في جلب البيانات:', error);
            document.getElementById('loading').innerHTML = '<p class="text-danger">فشل تحميل البيانات. تأكد من إعدادات الـ Deploy.</p>';
        }
    }

    fetchAppointments();
</script>

</body>
</html>
