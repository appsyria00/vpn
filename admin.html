<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة منطقة مدينة التل - A.M</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; }
        .admin-header { background: #1e293b; padding: 25px; border-bottom: 2px solid #334155; margin-bottom: 20px; }
        .search-area { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .apt-card { background: #1e293b; border-radius: 12px; border-right: 5px solid #3b82f6; margin-bottom: 15px; padding: 15px; }
        .status-done { border-right-color: #10b981; opacity: 0.6; }
        .form-control, .form-select { background: #334155; border: none; color: white; }
        .form-control:focus { background: #475569; color: white; }
    </style>
</head>
<body>
    <div class="admin-header text-center">
        <h2>إدارة منطقة مدينة التل</h2>
        <small>لوحة التحكم الذكية - A.M</small>
    </div>
    <div class="container">
        <div class="search-area">
            <div class="row g-2">
                <div class="col-md-8"><input type="text" id="q" class="form-control" placeholder="ابحث بالاسم أو الرقم..." onkeyup="render()"></div>
                <div class="col-md-4"><button class="btn btn-primary w-100" onclick="load()">تحديث البيانات</button></div>
            </div>
        </div>
        <div id="out"></div>
    </div>
    <script>
        const API = 'https://script.google.com/macros/s/AKfycbw1ercIP8aH_2LLHYvzfKz9JspMs7nBhhOvp69p--yjC5oRO5xakUY7WldML-TTKzuBuQ/exec';
        let list = [];
        async function load() {
            const r = await fetch(API);
            list = await r.json();
            render();
        }
        function render() {
            const q = document.getElementById('q').value.toLowerCase();
            const out = document.getElementById('out');
            out.innerHTML = '';
            list.filter(i => i.name.toLowerCase().includes(q) || i.phone.includes(q)).reverse().forEach(i => {
                const isD = i.status === "DONE";
                out.innerHTML += `
                <div class="apt-card ${isD ? 'status-done' : ''}">
                    <div class="d-flex justify-content-between">
                        <strong>${i.name}</strong>
                        <span class="text-info">${i.time}</span>
                    </div>
                    <div class="small text-muted">${i.date.split('T')[0]} - ${i.service}</div>
                    <div class="mt-2 d-flex gap-2">
                        ${!isD ? `<button onclick="act('updateStatus','${i.name}','${i.timestamp}')" class="btn btn-success btn-sm">إتمام</button>` : ''}
                        <button onclick="act('deleteRow','${i.name}','${i.timestamp}')" class="btn btn-danger btn-sm">حذف</button>
                    </div>
                </div>`;
            });
        }
        async function act(type, n, ts) {
            await fetch(API, {method: 'POST', body: JSON.stringify({action: type, name: n, timestamp: ts})});
            load();
        }
        window.onload = load;
    </script>
</body>
</html>
