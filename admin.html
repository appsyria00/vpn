<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المواعيد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; padding: 20px; }
        .card-apt { background: white; border-radius: 15px; padding: 20px; margin-bottom: 15px; border-right: 5px solid #0088cc; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .done { opacity: 0.5; background: #e9ecef; border-right-color: #6c757d; }
        .btn-call { background: #28a745; color: white; text-decoration: none; display: block; text-align: center; border-radius: 8px; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">📋 المواعيد المسجلة</h2>
        <div class="row g-2 mb-4">
            <div class="col-6"><input type="text" id="srch" class="form-control" placeholder="بحث..." onkeyup="fltr()"></div>
            <div class="col-6"><input type="date" id="dt" class="form-control" onchange="fltr()"></div>
        </div>
        <div id="list" class="row"></div>
    </div>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbzwSIydetGx9HBNMu8orrGrpwlF09Z7ulIkvsj5HWY2mTYxNk8L8QCK3b6qwH7dil7Evw/exec';
        let data = [];

        async function load() {
            const r = await fetch(url);
            data = await r.json();
            fltr();
        }

        function fltr() {
            const s = document.getElementById('srch').value.toLowerCase();
            const d = document.getElementById('dt').value;
            const res = data.filter(i => (i.name.toLowerCase().includes(s) || i.phone.includes(s)) && (!d || i.date === d));
            
            const cont = document.getElementById('list');
            cont.innerHTML = '';
            res.reverse().forEach(i => {
                const isD = i.status === "DONE";
                cont.innerHTML += `
                    <div class="col-md-4">
                        <div class="card-apt ${isD ? 'done' : ''}">
                            <div class="d-flex justify-content-between small text-primary mb-2">
                                <span>${i.service}</span> <span>${i.date}</span>
                            </div>
                            <h5>${i.name}</h5>
                            <p class="mb-0 text-muted">${i.phone}</p>
                            ${!isD ? `<a href="tel:${i.phone}" class="btn-call">اتصال</a>` : '<p class="text-center mt-2 fw-bold">✓ مكتمل</p>'}
                        </div>
                    </div>`;
            });
        }
        load();
    </script>
</body>
</html>
