<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة إدارة منطقة التل المدنية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #f4f7f6; font-family: sans-serif; }
        .nav-head { background: #1a2a6c; color: white; padding: 15px; border-bottom: 5px solid #fdbb2d; }
        .admin-logo { width: 50px; height: 50px; border-radius: 50%; margin-left: 10px; border: 2px solid white; }
        .apt-card { background: white; border-radius: 15px; border-right: 6px solid #0088cc; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; }
        .done { opacity: 0.6; filter: grayscale(0.7); background: #e9ecef !important; }
        .footer-am { text-align: center; padding: 20px; color: #aaa; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="nav-head d-flex align-items-center justify-content-center shadow mb-4">
        <img src="https://appsyria00.github.io/vpn/1.png" class="admin-logo" alt="Logo">
        <h3 class="m-0">مواعيد إدارة منطقة التل المدنية</h3>
    </div>
    <div class="container">
        <div class="row g-2 mb-4 bg-white p-3 rounded shadow-sm">
            <div class="col-md-6"><input type="text" id="q" class="form-control" placeholder="بحث..." onkeyup="render()"></div>
            <div class="col-md-4"><input type="date" id="df" class="form-control" onchange="render()"></div>
            <div class="col-md-2"><button class="btn btn-primary w-100" onclick="load()"><i class="fas fa-sync"></i></button></div>
        </div>
        <div id="loading-spinner" class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        <div class="row" id="out"></div>
        <div class="footer-am">تصميم A.M</div>
    </div>

    <script>
        const api = 'https://script.google.com/macros/s/AKfycbyE84E-L17q9kaFhJux-RmcMKJZyr56m7eFtxLzGNFjKlZBcz-Icu0n3vrO2PYExuUMsg/exec';
        let list = [];
        async function load() {
            document.getElementById('loading-spinner').style.display = 'block';
            try { const r = await fetch(api); list = await r.json(); render(); } catch(e) { Swal.fire('خطأ', 'فشل التحميل', 'error'); }
            document.getElementById('loading-spinner').style.display = 'none';
        }
        function render() {
            const q = document.getElementById('q').value.toLowerCase();
            const dFilter = document.getElementById('df').value;
            const out = document.getElementById('out');
            out.innerHTML = '';
            list.filter(i => (i.name.toLowerCase().includes(q) || i.phone.includes(q)) && (!dFilter || i.date.includes(dFilter)))
            .reverse().forEach(i => {
                const isD = i.status === "DONE";
                const cleanDate = i.date.substring(0, 10);
                out.innerHTML += `
                    <div class="col-md-4 mb-3">
                        <div class="apt-card p-3 ${isD ? 'done' : ''}">
                            <div class="d-flex justify-content-between mb-2 small"><span class="badge bg-info text-dark">${i.service}</span><span>${i.time}</span></div>
                            <h5 class="fw-bold">${i.name}</h5>
                            <p class="text-muted small"><i class="fas fa-calendar"></i> ${cleanDate}</p>
                            <div class="d-flex gap-2">
                                ${!isD ? `<button onclick="act('updateStatus','${i.name}','${i.timestamp}')" class="btn btn-success btn-sm flex-fill">تم اللقاء</button>` : '<span class="flex-fill text-muted">مكتمل ✓</span>'}
                                <button onclick="act('deleteRow','${i.name}','${i.timestamp}')" class="btn btn-outline-danger btn-sm"><i class="fas fa-trash"></i></button>
                                <a href="tel:${i.phone}" class="btn btn-outline-primary btn-sm"><i class="fas fa-phone"></i></a>
                            </div>
                        </div>
                    </div>`;
            });
        }
        async function act(type, n, t) {
            Swal.fire({title:'جاري التنفيذ...', didOpen:()=>Swal.showLoading()});
            await fetch(api, {method:'POST', body: JSON.stringify({action:type, name:n, timestamp:t})});
            Swal.close(); await load();
        }
        load();
    </script>
</body>
</html>
