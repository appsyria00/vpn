<div class="container mb-4">
    <div class="input-group shadow-sm">
        <span class="input-group-text bg-white border-0"><i class="fas fa-search text-muted"></i></span>
        <input type="text" id="searchInput" class="form-control border-0 p-3" placeholder="ابحث بالاسم أو رقم الهاتف..." onkeyup="filterData()">
    </div>
</div>

<script>
    function filterData() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('col-md-6'); // استهداف كروت المواعيد
        
        for (let i = 0; i < cards.length; i++) {
            let name = cards[i].innerText.toLowerCase();
            if (name.includes(input)) {
                cards[i].style.display = "";
            } else {
                cards[i].style.display = "none";
            }
        }
    }
</script>
