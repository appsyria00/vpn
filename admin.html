<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة التل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #f4f7f6; font-family: sans-serif; }
        .nav-head { background: #1a2a6c; color: white; padding: 20px; border-bottom: 5px solid #fdbb2d; }
        .apt-card { background: white; border-radius: 15px; border-right: 6px solid #0088cc; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .done { opacity: 0.6; filter: grayscale(0.7); background: #e9ecef !important; border-right-color: #6c757d !important; }
    </style>
</head>
<body>
    <div class="nav-head text-center shadow mb-4"><h3>لوحة إدارة منطقة التل</h3></div>
    <div class="container">
        <div class="row g-2 mb-4 bg-white p-3 rounded shadow-sm">
            <div class="col-md-6"><input type="text" id="q" class="form-control" placeholder="بحث بالاسم أو الرقم..." onkeyup="render()"></div>
            <div class="col-md-4"><input type="date" id="df" class="form-control" onchange="render()"></div>
            <div class="col-md-2"><button class="btn btn-primary w-100" onclick="load()"><i class="fas fa-sync"></i> تحديث</button></div>
        </div>
        <div id="loading-spinner" class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2 text-muted">جاري جلب البيانات...</p>
        </div>
        <div class="row" id="out"></div>
    </div>

    <script>
        const api = 'https://script.google.com/macros/s/AKfycbyu0l8PAVfBUAlS6bo1QfSjnm3H9qPfeWWgKXxiHBshr0vFzrrtjdc448aBAU3a7ts9fQ/exec';
        let list = [];

        async function load() {
            document.getElementById('loading-spinner').style.display = 'block';
            document.getElementById('out').innerHTML = '';
            try {
                const r = await fetch(api);
                list = await r.json();
                render();
            } catch(e) { Swal.fire('خطأ', 'فشل تحميل البيانات', 'error'); }
            document.getElementById('loading-spinner').style.display = 'none';
        }

        function render() {
            const q = document.getElementById('q').value.toLowerCase();
            const d = document.getElementById('df').value;
            const out = document.getElementById('out');
            out.innerHTML = '';
            list.filter(i => (i.name.toLowerCase().includes(q) || i.phone.includes(q)) && (!d || i.date === d))
            .reverse().forEach(i => {
                const isD = i.status === "DONE";
                out.innerHTML += `
                    <div class="col-md-4 mb-3">
                        <div class="apt-card p-3 ${isD ? 'done' : ''}">
                            <div class="d-flex justify-content-between small mb-2">
                                <span class="badge bg-light text-primary border">${i.service}</span>
                                <span class="text-muted"><i class="far fa-clock"></i> ${i.time}</span>
                            </div>
                            <h5 class="fw-bold mb-1">${i.name}</h5>
                            <p class="text-primary small mb-3"><i class="fas fa-calendar-day"></i> ${i.date}</p>
                            <div class="d-flex gap-2">
                                ${!isD ? `<button onclick="act('updateStatus','${i.name}','${i.timestamp}')" class="btn btn-success btn-sm flex-fill">تم اللقاء</button>` : '<span class="flex-fill fw-bold text-muted small text-center">✓ مكتمل</span>'}
                                <button onclick="act('deleteRow','${i.name}','${i.timestamp}')" class="btn btn-outline-danger btn-sm"><i class="fas fa-trash"></i></button>
                                <a href="tel:${i.phone}" class="btn btn-outline-primary btn-sm"><i class="fas fa-phone"></i></a>
                            </div>
                        </div>
                    </div>`;
            });
        }

        async function act(type, n, t) {
            const conf = await Swal.fire({ title: 'تأكيد العملية؟', showCancelButton: true });
            if(conf.isConfirmed) {
                Swal.fire({ title: 'جاري التنفيذ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                try {
                    await fetch(api, { method: 'POST', body: JSON.stringify({action: type, name: n, timestamp: t}) });
                    Swal.close(); 
                    await load();
                } catch(e) { Swal.close(); Swal.fire('خطأ', 'فشل في الاتصال', 'error'); }
            }
        }
        load();
    </script>
</body>
</html>
