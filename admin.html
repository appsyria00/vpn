<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة مواعيد التل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #f0f2f5; font-family: sans-serif; }
        .nav-head { background: #1a2a6c; color: white; padding: 20px; border-bottom: 5px solid #fdbb2d; }
        .apt-card { background: white; border-radius: 12px; border-right: 6px solid #0088cc; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .done-card { opacity: 0.6; filter: grayscale(0.5); background: #e9ecef !important; border-right-color: #6c757d !important; }
    </style>
</head>
<body>
<div class="nav-head text-center shadow mb-4">
    <h3>لوحة إدارة منطقة التل المدنية</h3>
</div>
<div class="container">
    <div class="row g-2 mb-4 p-3 bg-white rounded shadow-sm">
        <div class="col-md-6"><input type="text" id="srch" class="form-control" placeholder="بحث بالاسم أو الرقم..." onkeyup="render()"></div>
        <div class="col-md-4"><input type="date" id="dt" class="form-control" onchange="render()"></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" onclick="fetchData()"><i class="fas fa-sync"></i></button></div>
    </div>
    <div id="loader" class="text-center py-5"><div class="spinner-border text-primary"></div></div>
    <div class="row" id="displayArea"></div>
</div>

<script>
    const api = 'ضع_هنا_رابط_الـ_DEPLOY_الجديد';
    let appointments = [];

    async function fetchData() {
        document.getElementById('loader').style.display = 'block';
        try {
            const r = await fetch(api);
            appointments = await r.json();
            render();
        } catch (e) { Swal.fire('خطأ', 'فشل جلب البيانات', 'error'); }
        document.getElementById('loader').style.display = 'none';
    }

    function render() {
        const q = document.getElementById('srch').value.toLowerCase();
        const d = document.getElementById('dt').value;
        const area = document.getElementById('displayArea');
        area.innerHTML = '';

        appointments.filter(i => (i.name.toLowerCase().includes(q) || i.phone.includes(q)) && (!d || i.date === d))
        .reverse().forEach(i => {
            const isD = i.status === "DONE";
            area.innerHTML += `
                <div class="col-md-4 mb-3">
                    <div class="apt-card p-3 ${isD ? 'done-card' : ''}">
                        <div class="d-flex justify-content-between mb-2 small">
                            <span class="badge bg-light text-primary border">${i.service}</span>
                            <span class="text-muted"><i class="far fa-clock"></i> ${i.time}</span>
                        </div>
                        <h5 class="fw-bold mb-1">${i.name}</h5>
                        <p class="text-primary small mb-2"><i class="fas fa-calendar-day"></i> ${i.date}</p>
                        <div class="d-flex gap-2 mt-3">
                            ${!isD ? `<button onclick="action('updateStatus','${i.name}','${i.timestamp}')" class="btn btn-success btn-sm flex-fill">تم اللقاء</button>` : '<span class="text-muted small fw-bold flex-fill">✓ مكتمل</span>'}
                            <button onclick="action('deleteRow','${i.name}','${i.timestamp}')" class="btn btn-outline-danger btn-sm"><i class="fas fa-trash"></i></button>
                            <a href="tel:${i.phone}" class="btn btn-outline-primary btn-sm"><i class="fas fa-phone"></i></a>
                        </div>
                    </div>
                </div>`;
        });
    }

    async function action(type, n, t) {
        const conf = await Swal.fire({ title: 'تأكيد؟', showCancelButton: true });
        if(conf.isConfirmed) {
            Swal.fire({ title: 'جاري المعالجة...', didOpen: () => Swal.showLoading() });
            await fetch(api, { method:'POST', body: JSON.stringify({action: type, name: n, timestamp: t}) });
            fetchData();
        }
    }
    fetchData();
</script>
</body>
</html>
