<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة لمواعيد إدارة منطقة التل المدنية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #f0f2f5; font-family: sans-serif; }
        .nav-head { background: #1a2a6c; color: white; padding: 20px; margin-bottom: 20px; border-bottom: 5px solid #fdbb2d; }
        .apt-card { background: white; border-radius: 12px; border: none; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-right: 6px solid #0088cc; position: relative; }
        .done-style { opacity: 0.6; filter: grayscale(0.6); background: #e9ecef !important; border-right-color: #6c757d !important; }
        .btn-action-group { display: flex; gap: 8px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="nav-head text-center shadow">
    <h3><i class="fas fa-user-shield"></i> مواعيد إدارة منطقة التل المدنية</h3>
</div>

<div class="container">
    <div class="row g-2 mb-4 p-3 bg-white rounded shadow-sm">
        <div class="col-md-5"><input type="text" id="srch" class="form-control" placeholder="بحث بالاسم أو الرقم..." onkeyup="render()"></div>
        <div class="col-md-4"><input type="date" id="dt" class="form-control" onchange="render()"></div>
        <div class="col-md-3"><button class="btn btn-primary w-100" onclick="fetchData()"><i class="fas fa-sync"></i> تحديث البيانات</button></div>
    </div>

    <div id="loader" class="text-center py-5"><div class="spinner-border text-primary"></div><p>جاري تحميل المواعيد...</p></div>
    <div class="row" id="displayArea"></div>
</div>

<script>
    const api = 'https://script.google.com/macros/s/AKfycbx4r3EnoSUM9Rxfgc3hCeFflayvuqeE3a8A4sQykiEzIBSn8uGcu_pP--IfmFFz86u0GQ/exec';
    let appointments = [];

    async function fetchData() {
        document.getElementById('loader').style.display = 'block';
        document.getElementById('displayArea').innerHTML = '';
        try {
            const r = await fetch(api);
            appointments = await r.json();
            render();
        } catch (e) {
            Swal.fire('خطأ', 'فشل في جلب البيانات، تأكد من إعدادات النشر', 'error');
        }
        document.getElementById('loader').style.display = 'none';
    }

    function render() {
        const q = document.getElementById('srch').value.toLowerCase();
        const d = document.getElementById('dt').value;
        const area = document.getElementById('displayArea');
        area.innerHTML = '';

        const filtered = appointments.filter(i => (i.name.toLowerCase().includes(q) || i.phone.includes(q)) && (!d || i.date === d));
        
        if(filtered.length === 0) { area.innerHTML = '<h5 class="text-center text-muted">لا توجد مواعيد حالياً</h5>'; return; }

        filtered.reverse().forEach(i => {
            const isD = i.status === "DONE";
            area.innerHTML += `
                <div class="col-md-4 mb-4">
                    <div class="apt-card p-3 ${isD ? 'done-style' : ''}">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="badge bg-light text-primary border">${i.service}</span>
                            <small class="text-muted">${i.date}</small>
                        </div>
                        <h5 class="fw-bold">${i.name}</h5>
                        <p class="text-primary mb-1"><i class="fas fa-phone-alt"></i> ${i.phone}</p>
                        <div class="btn-action-group">
                            ${!isD ? `<button onclick="update('${i.name}', '${i.timestamp}')" class="btn btn-success btn-sm flex-fill">تم اللقاء</button>` : '<span class="fw-bold text-muted flex-fill">✓ مكتمل</span>'}
                            <button onclick="del('${i.name}', '${i.timestamp}')" class="btn btn-outline-danger btn-sm"><i class="fas fa-trash"></i></button>
                            ${!isD ? `<a href="tel:${i.phone}" class="btn btn-outline-primary btn-sm"><i class="fas fa-phone"></i></a>` : ''}
                        </div>
                    </div>
                </div>`;
        });
    }

    async function update(n, t) {
        Swal.fire({title:'جاري الحفظ...', didOpen:()=>Swal.showLoading()});
        await fetch(api, {method:'POST', body: JSON.stringify({action:'updateStatus', name:n, timestamp:t})});
        fetchData();
    }

    async function del(n, t) {
        const conf = await Swal.fire({title:'حذف؟', text:'سيتم مسحه نهائياً من الجدول', icon:'warning', showCancelButton:true});
        if(conf.isConfirmed) {
            Swal.fire({title:'جاري الحذف...', didOpen:()=>Swal.showLoading()});
            await fetch(api, {method:'POST', body: JSON.stringify({action:'deleteRow', name:n, timestamp:t})});
            fetchData();
        }
    }

    fetchData();
</script>
</body>
</html>
