<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة مدينة التل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding-bottom: 50px; }
        .admin-header { background: #1e293b; padding: 30px; border-bottom: 2px solid #334155; margin-bottom: 25px; text-align: center; }
        .search-area { background: #1e293b; padding: 20px; border-radius: 20px; margin-bottom: 25px; border: 1px solid #334155; }
        .apt-card { background: #1e293b; border-radius: 15px; border-right: 6px solid #3b82f6; margin-bottom: 15px; padding: 20px; border-top: 1px solid #334155; }
        .status-done { border-right-color: #10b981; opacity: 0.6; }
        .form-control { background: #334155; border: 1px solid #475569; color: white; border-radius: 10px; }
        .form-control:focus { background: #475569; color: white; border-color: #3b82f6; }
        .btn-update { background: #3b82f6; border: none; font-weight: bold; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="admin-header">
        <h2 class="fw-bold">إدارة منطقة مدينة التل</h2>
        <span class="badge bg-primary">لوحة التحكم الذكية - A.M</span>
    </div>

    <div class="container">
        <div class="search-area">
            <div class="row g-2">
                <div class="col-md-5">
                    <input type="text" id="q" class="form-control" placeholder="🔍 بحث بالاسم أو الرقم..." onkeyup="render()">
                </div>
                <div class="col-md-4">
                    <input type="date" id="df" class="form-control" onchange="render()">
                </div>
                <div class="col-md-3">
                    <button class="btn btn-update w-100 text-white" onclick="load()">تحديث البيانات</button>
                </div>
            </div>
        </div>

        <div id="out"></div>
        <div class="text-center mt-5 text-muted small">تصميم A.M &copy; 2026</div>
    </div>

    <script>
        const API = 'https://script.google.com/macros/s/AKfycbycQ1WfZL86r3WZArEiVyeUgCEAPnDJvMLsp0_Y_GPuQVyqwxSmdW2fXKGB2LvxHtcjXg/exec';
        let list = [];

        async function load() {
            try {
                const r = await fetch(API);
                list = await r.json();
                render();
            } catch(e) { alert("خطأ في جلب البيانات"); }
        }

        function render() {
            const q = document.getElementById('q').value.toLowerCase();
            const dF = document.getElementById('df').value;
            const out = document.getElementById('out');
            out.innerHTML = '';

            list.filter(i => (i.name.toLowerCase().includes(q) || i.phone.includes(q)) && (!dF || i.date.includes(dF)))
            .reverse().forEach(i => {
                const isD = i.status === "DONE";
                out.innerHTML += `
                <div class="apt-card ${isD ? 'status-done' : ''}">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1 fw-bold">${i.name}</h5>
                            <div class="text-info small">${i.date.split('T')[0]} | ${i.time} | ${i.service}</div>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="tel:${i.phone}" class="btn btn-outline-light btn-sm">اتصال</a>
                            ${!isD ? `<button onclick="act('updateStatus','${i.name}','${i.timestamp}')" class="btn btn-success btn-sm">إتمام</button>` : ''}
                            <button onclick="act('deleteRow','${i.name}','${i.timestamp}')" class="btn btn-danger btn-sm">حذف</button>
                        </div>
                    </div>
                </div>`;
            });
        }

        async function act(type, n, ts) {
            if(confirm('متأكد؟')) {
                await fetch(API, {method: 'POST', body: JSON.stringify({action: type, name: n, timestamp: ts})});
                load();
            }
        }
        window.onload = load;
    </script>
</body>
</html>
